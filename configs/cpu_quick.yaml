# Быстрый прогон на CPU (или проверка конвейера перед GPU): заморожены энкодер и
# контекстуализатор, признаки BENDR считаются один раз на фолд, учится только голова.
# Файл самодостаточный, ключи те же, что в gpu.yaml.
# Значения с пометкой «CPU» повторяют рабочий конфиг CPU-экспериментов НИР-3 (выбраны автором).

seed: 42
device: cpu

paths:
  raw_dir: data/chbmit
  weights_dir: weights
  cache_dir: data/cache
  results_dir: results
  run_name: null

norm: window                     # CPU: лучший вариант по val AUC

data:
  patients: [chb01, chb02, chb03, chb04, chb05]   # CPU: подмножество
  sampling_rate_hz: 256
  window_sec: 4
  postictal_exclusion_min: 15
  train_max_background_per_file: 40               # CPU: урезание фона в обучающих файлах
  filter: {order: 5, low_hz: 0.5, high_hz: 50.0}
  channels:
    drop: [FT9-FT10, FT10-T8, T7-FT9]
    on_missing: skip_file
    bendr_order: [FP1, FP2, F7, F3, FZ, F4, F8, T7, C3, CZ, C4, T8, T5, P3, PZ, P4, T6, O1, O2, SCALE]
    mapping: {FP1: FP1-F7, FP2: F7-T7, F7: T7-P7, F3: P7-O1, FZ: FP1-F3, F4: F3-C3, F8: C3-P3,
              T7: P3-O1, C3: FP2-F4, CZ: F4-C4, C4: C4-P4, T8: P4-O2, T5: FP2-F8, P3: F8-T8,
              PZ: T8-P8, P4: P8-O2, T6: FZ-CZ, O1: CZ-PZ, O2: P7-T7}

model:
  n_channels: 20
  encoder_h: 512
  enc_width: [3, 2, 2, 2, 2, 2]
  enc_downsample: [3, 2, 2, 2, 2, 2]
  d_model: 1536
  ff_dim: 3076
  n_layers: 8
  n_heads: 8
  relative_pos_kernel: 25
  relative_pos_groups: 16
  channel_dropout_p: 0.5
  contextualizer_dropout: 0.15
  feature: ctx_mean              # CPU: лучший вариант по val AUC

loss: {alpha: 0.3, beta: 0.5}    # диссертация

training:
  scheme: lopo
  freeze: backbone               # CPU: только голова
  unfreeze_last: 2
  data_fractions: [1.0]
  val_fraction: 0.2
  balancing: sampler
  samples_per_epoch: null
  lr: 0.001                      # CPU: для линейной головы (1e-4 в диссертации — для полного дообучения)
  weight_decay: 0.01
  scheduler_factor: 0.1
  scheduler_patience: 5
  early_stopping_patience: 8     # CPU (в диссертации 15)
  early_stopping_min_delta: 0.0001
  max_epochs: 25                 # CPU
  batch_size: 32                 # CPU
  amp: false
  num_workers: 0
  patient_wise: {test_fraction: 0.3}

postprocessing:
  threshold: youden
  vote_widths: [3, 5, 7]
