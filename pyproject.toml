[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bendr-seizure"
version = "0.3.0"
description = "Дообучение BENDR для детекции приступов на CHB-MIT"
readme = "README.md"
requires-python = ">=3.10"
# Зависимости ставятся из requirements.txt (и torch — отдельно, с нужной CUDA).

[tool.setuptools.packages.find]
include = ["bendr_seizure*"]
