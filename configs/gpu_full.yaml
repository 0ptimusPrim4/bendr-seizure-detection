# Конфигурация полного прогона на GPU (параметры из диссертации / репозитория).
# Значения без пометки «выбрано автором» взяты из Benfenati (2023) и
# configs/default.yaml репозитория 0ptimusPrim4/bendr-seizure-detection
# (см. также NOTES.md, раздел 7).

seed: 42

# Короткие ключи (удобно менять). Для полного дообучения (mode: full)
# feature_variant используется только в режиме head_only / diagnose.
# feature_variant: ctx_first | ctx_last | ctx_mean | enc_mean
# norm: global (z-score по train, диссертация) | window (внутри окна, выбор автора)
feature_variant: ctx_first   # официальная голова на первом токене
norm: global                 # диссертация / репозиторий

# auto — CUDA, если доступна, иначе CPU. Для этого конфига предполагается GPU.
device: auto

paths:
  raw_dir: data/chbmit
  weights_dir: weights
  results_dir: results
  checkpoints_dir: results/checkpoints
  experiment_dir: lopo_gpu

data:
  dataset: chb-mit
  source_url: https://physionet.org/content/chbmit/1.0.0/
  sampling_rate_hz: 256          # диссертация / репозиторий
  window_sec: 4                  # диссертация / репозиторий
  n_channels_out: 20             # диссертация / репозиторий
  postictal_exclusion_min: 15    # диссертация / репозиторий
  # Список как в исходном репозитории и в SUBJECT-INFO PhysioNet: 23 случая (chb01–chb23).
  # Папка chb24 есть в наборе (добавлена позже). Чтобы включить её в LOPO, допишите chb24 в этот список.
  patients: [chb01, chb02, chb03, chb04, chb05, chb06, chb07, chb08, chb09, chb10, chb11, chb12, chb13, chb14, chb15, chb16, chb17, chb18, chb19, chb20, chb21, chb22, chb23]
  # Полный прогон: фон не усекаем. Осторожно с объёмом ОЗУ.
  max_background_per_file: null
  max_background_files: null
  test_max_background_per_file: null
  test_max_background_files: null
  # Относительная амплитуда (канал SCALE) считается, а не берётся из T7-FT9.
  # Это закрывает TODO исходного репозитория и соответствует To1020 BENDR.
  scale_channel: relative_amplitude  # выбрано автором (вместо отведения T7-FT9)
  filter:
    type: butterworth
    order: 5
    low_hz: 0.5
    high_hz: 50.0
  normalization:
    method: z-score
    fit_on: train
    scope: global             # дублирует ключ norm; при наличии обоих берётся norm
  balancing:
    method: weighted_random_sampling
  channels:
    drop:
      - FT9-FT10
      - FT10-T8
      - T7-FT9
    drop_later_duplicates: true
    on_missing: error
    bendr_order:
      - FP1
      - FP2
      - F7
      - F3
      - FZ
      - F4
      - F8
      - T7
      - C3
      - CZ
      - C4
      - T8
      - T5
      - P3
      - PZ
      - P4
      - T6
      - O1
      - O2
      - SCALE
    mapping:
      FP1: FP1-F7
      FP2: F7-T7
      F7: T7-P7
      F3: P7-O1
      FZ: FP1-F3
      F4: F3-C3
      F8: C3-P3
      T7: P3-O1
      C3: FP2-F4
      CZ: F4-C4
      C4: C4-P4
      T8: P4-O2
      T5: FP2-F8
      P3: F8-T8
      PZ: T8-P8
      P4: P8-O2
      T6: FZ-CZ
      O1: CZ-PZ
      O2: P7-T7

model:
  encoder_h: 512
  # Ядра (3,2,2,2,2,2) в официальном коде делаются нечётными: (3,3,3,3,3,3).
  # Шаги остаются (3,2,2,2,2,2), произведение 96. Иначе веса encoder.pt не сходятся.
  enc_width: [3, 2, 2, 2, 2, 2]
  enc_downsample: [3, 2, 2, 2, 2, 2]
  d_model: 1536
  ff_dim: 3076
  n_layers: 8
  n_heads: 8
  relative_pos_kernel: 25
  relative_pos_groups: 16
  channel_dropout_p: 0.5
  contextualizer_dropout: 0.15
  n_classes: 2
  use_first_token: true
  masking: false

loss:
  name: sensitivity_specificity_weighted_cross_entropy
  alpha: 0.3    # диссертация / репозиторий
  beta: 0.5     # диссертация / репозиторий

training:
  optimizer: adam
  lr: 0.0001                   # диссертация / репозиторий (полное дообучение)
  weight_decay: 0.01           # диссертация / репозиторий
  scheduler: reduce_on_plateau
  scheduler_mode: min
  scheduler_factor: 0.1        # диссертация / репозиторий
  scheduler_patience: 5        # диссертация / репозиторий
  early_stopping_monitor: val_loss
  early_stopping_patience: 15  # диссертация / репозиторий
  early_stopping_min_delta: 0.0001  # диссертация / репозиторий
  batch_size: 256              # диссертация / репозиторий
  batch_size_cpu: 8            # было в репозитории; на GPU не используется
  feature_batch_size: 16       # выбрано автором (только если mode: head_only)
  max_epochs: 120              # диссертация / репозиторий (верхняя граница)
  # Полное дообучение: энкодер и контекстуализатор разморожены.
  # Чтобы учить только голову, поставьте оба freeze_* в true и mode: head_only.
  freeze_encoder: false
  freeze_contextualizer: false
  mode: full                   # full | head_only
  lopo:
    val_fraction: 0.2          # диссертация / репозиторий
    stratify: true
  data_fractions: [0.25, 0.5, 1.0]  # диссертация / репозиторий (доли обучающей выборки)

features:
  cache_dir: results/feature_cache

postprocessing:
  threshold:
    mode: argmax             # как в исходном конвейере; youden — выбор автора, см. cpu_quick.yaml
  smoothing:
    enabled: true
    method: majority_voting
    window: 3                  # диссертация / репозиторий
  fp_grouping:
    enabled: true
  event_based_sensitivity:
    enabled: true

weights:
  encoder_filename: encoder.pt
  contextualizer_filename: contextualizer.pt
  source_url: https://github.com/SPOClab-ca/BENDR/releases/tag/v0.1-alpha
