# Полный прогон на GPU: дообучение BENDR на CHB-MIT по схеме LOPO.
# Пометки:
#   «диссертация» — значение из Benfenati (2023) / исходного configs/default.yaml;
#   «выбрано автором» — введено в НИР-3, в диссертации не задано.
# Любой ключ можно переопределить флагом:  --set training.lr=1e-4

seed: 42
device: auto                     # auto | cuda | cpu

paths:
  raw_dir: data/chbmit           # записи PhysioNet: data/chbmit/chb01/chb01_01.edf ...
  weights_dir: weights           # encoder.pt, contextualizer.pt (BENDR v0.1-alpha)
  cache_dir: data/cache          # кэш окон после prepare_data.py
  results_dir: results           # results/<run_name>/...
  run_name: null                 # null → <схема>_<режим заморозки>, например lopo_full

# Нормализация: global — z-score по каналам со статистиками обучающих пациентов (диссертация);
# window — z-score внутри каждого окна (выбрано автором, лучший вариант CPU-экспериментов).
norm: global

data:
  # 23 случая chb01–chb23 (SUBJECT-INFO PhysioNet). chb24 при желании допишите вручную.
  patients: [chb01, chb02, chb03, chb04, chb05, chb06, chb07, chb08, chb09, chb10, chb11, chb12,
             chb13, chb14, chb15, chb16, chb17, chb18, chb19, chb20, chb21, chb22, chb23]
  sampling_rate_hz: 256          # диссертация
  window_sec: 4                  # диссертация (1024 отсчёта)
  postictal_exclusion_min: 15    # диссертация
  # Урезание фона в обучающих файлах (null — все окна). Тест всегда без урезания.
  train_max_background_per_file: null
  filter:                        # полосовой Баттерворт, диссертация
    order: 5
    low_hz: 0.5
    high_hz: 50.0
  channels:
    # Отбрасываются отведения вне схемы 10-20 и второй T8-P8; канал SCALE считается
    # как относительная амплитуда (выбрано автором, по аналогии с To1020 из BENDR).
    drop: [FT9-FT10, FT10-T8, T7-FT9]
    # skip_file — файл с неполным монтажом пропускается и пишется в meta.json (выбрано автором);
    # error — остановиться; zero — заполнить недостающие каналы нулями.
    on_missing: skip_file
    bendr_order: [FP1, FP2, F7, F3, FZ, F4, F8, T7, C3, CZ, C4, T8, T5, P3, PZ, P4, T6, O1, O2, SCALE]
    # Порядок слотов, а не геометрия электродов (таблицы пар в диссертации нет).
    mapping:
      FP1: FP1-F7
      FP2: F7-T7
      F7: T7-P7
      F3: P7-O1
      FZ: FP1-F3
      F4: F3-C3
      F8: C3-P3
      T7: P3-O1
      C3: FP2-F4
      CZ: F4-C4
      C4: C4-P4
      T8: P4-O2
      T5: FP2-F8
      P3: F8-T8
      PZ: T8-P8
      P4: P8-O2
      T6: FZ-CZ
      O1: CZ-PZ
      O2: P7-T7

model:                           # архитектура BENDR, под неё веса v0.1-alpha
  n_channels: 20
  encoder_h: 512
  enc_width: [3, 2, 2, 2, 2, 2]  # чётные ядра в коде становятся нечётными, как в SPOClab-ca/BENDR
  enc_downsample: [3, 2, 2, 2, 2, 2]
  d_model: 1536
  ff_dim: 3076
  n_layers: 8
  n_heads: 8
  relative_pos_kernel: 25
  relative_pos_groups: 16
  channel_dropout_p: 0.5
  contextualizer_dropout: 0.15
  # Вход головы: ctx_first — первый токен контекстуализатора (официальная схема);
  # ctx_mean — среднее по токенам, enc_mean — среднее выхода энкодера (варианты CPU-экспериментов).
  feature: ctx_first

loss:                            # SSWCE, диссертация, ур. (5.9)
  alpha: 0.3
  beta: 0.5

training:
  scheme: lopo                   # lopo | patient_wise
  # full — всё обучается (диссертация); encoder — заморожен энкодер;
  # backbone — только голова; partial — энкодер заморожен, учатся последние unfreeze_last слоёв.
  freeze: full
  unfreeze_last: 2               # только для partial; выбрано автором
  data_fractions: [1.0]          # варианты диссертации: [0.25, 0.5, 1.0]
  val_fraction: 0.2              # диссертация, стратификация по метке окна
  balancing: sampler             # sampler (WeightedRandomSampler, репозиторий) | class_weights | none
  samples_per_epoch: null        # null — столько, сколько окон в train; число — короче эпоха (выбрано автором)
  lr: 0.0001                     # диссертация
  weight_decay: 0.01             # диссертация
  scheduler_factor: 0.1          # ReduceLROnPlateau, диссертация
  scheduler_patience: 5          # диссертация
  early_stopping_patience: 15    # по val_loss, диссертация
  early_stopping_min_delta: 0.0001
  max_epochs: 120                # диссертация (верхняя граница)
  batch_size: 256                # диссертация; при нехватке видеопамяти уменьшите (--batch-size 64)
  amp: true                      # смешанная точность на GPU (выбрано автором)
  num_workers: 4                 # процессов DataLoader (выбрано автором)
  patient_wise:
    test_fraction: 0.3           # доля файлов пациента в тесте (выбрано автором)

postprocessing:
  threshold: youden              # youden — порог по валидации (выбрано автором); argmax — 0,5
  vote_widths: [3, 5, 7]         # 3 — диссертация; 5 и 7 — для сравнения (выбрано автором)
